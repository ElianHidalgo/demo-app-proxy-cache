<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        button { padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Catálogo de Productos</h1>
    <button onclick="cargarProductos()">Cargar Productos</button>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody id="tabla-productos">
            <!-- Los productos se inyectarán aquí -->
        </tbody>
    </table>

    <script>
        const API_URL = 'http://localhost:8080/api/productos'; // Ajusta la ruta según tu controller

        async function cargarProductos() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Error en la red');
                
                const productos = await response.json();
                const tbody = document.getElementById('tabla-productos');
                tbody.innerHTML = ''; // Limpiar tabla

                productos.forEach(producto => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${producto.id || '-'}</td>
                        <td>${producto.nombre}</td>
                        <td>$${producto.precio}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Hubo un problema con la petición Fetch:', error);
                alert('No se pudieron cargar los productos. Verifica que el backend esté corriendo y CORS esté configurado.');
            }
        }
    </script>
</body>
</html>
